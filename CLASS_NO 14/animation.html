<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animation</title>
    <style>
      .container {
        width: 100px;
        height: 100px;
        border: 1px solid;
        animation-name: identifier;
        animation-duration: 3s;
        animation-iteration-count: infinite;
        animation-name: changeColor;

        background-color: rgb(247, 81, 81);
        animation-delay: 4s;
        display: flex;
        text-align: center;
        justify-content: center;
        align-items: center;
      }
      .container:hover {
        animation-play-state: paused;
      }
      @keyframes identifier {
        /* form {
          transform: translateX(0px);
        }
        to {
          transform: translateX(500px);
          border-radius: 9px;
        } */
      }
      @keyframes changeColor {
        0% {
          transform: translateX(0px);
        }

        50% {
          background-color: black;
          border-radius: 50%;
        }
        100% {
          transform: translateX(500px);
          background-image: url(../Assignment_Of_Css/profile_image.png);
          background-repeat: no-repeat;
          background-size: cover;
        }
      }
      @keyframes loading {
        from {
          transform: rotate(0);
        }
        to {
          transform: rotate(360deg);
        }
      }
      .loading {
        width: 50px;
        height: 50px;
        border-top: 1px solid rgb(3, 3, 9);
        /* background-color: transparent; */
        margin: auto;
        border-radius: 50%;
        animation-name: loading;
        animation-duration: 2s;
        animation-iteration-count: infinite;
        /* animation-direction: reverse; */
        /* animation-direction: alternate; */
        /* animation-direction: alternate-reverse; */
        animation-fill-mode: both;
        animation-timing-function: linear;

        /* box-shadow: 2px 2px 10px; */
        box-shadow: 0 0 15px black;

        display: flex;
        text-align: center;
        align-items: center;
        justify-content: center;
        background-image: url(../Assignment_Of_Css/profile_image.png);
        background-repeat: no-repeat;
        background-size: cover;
      }
      .bounce {
        border: 1px solid;
        width: 100px;
        height: 100px;
        margin: auto;
        animation-name: bounce;
        animation-duration: 1s;
        border-radius: 50%;
        animation-iteration-count: infinite;
        animation-timing-function: linear;
        animation-direction: alternate-reverse;
      }
      @keyframes bounce {
        100% {
          transform: translateY(300px);
        }
        0% {
          transform: translateY(0);
        }
      }
      .sequre-move {
        border: transparent;

        width: 100px;
        height: 100px;
        animation-name: sequre-move;
        animation-duration: 5s;
        /* animation-direction: alternate; */
        position: relative;
        animation-iteration-count: infinite;
        animation-timing-function: linear;
        animation-delay: 2s;
        background-color: white;
        background-image: url(../Assignment_Of_Css/profile_image.png);
        background-repeat: no-repeat;
        background-size: cover;
      }
      @keyframes sequre-move {
        0% {
          /* transform: translateX(0px); */
          top: 0%;
          left: 0%;
        }
        25% {
          /* transform: translateX(500px); */
          top: 0%;
          left: 500px;
          border-radius: 50%;
          box-shadow: 0 0 30px black;
        }
        50% {
          /* transform: translateY(500px); */
          left: 500px;
          top: 500px;
        }
        75% {
          /* transform: translateY(500px); */
          left: 0;
          top: 500px;
          border-radius: 50%;
          box-shadow: 0 0 30px black;
        }
        100% {
          /* transform: translateX(500px); */
          top: 0%;
          left: 0%;
        }
      }
      .con {
        border: 2px solid;
        height: 599px;
        width: 600px;
        background-color: rgb(245, 88, 88);
      }
    </style>
  </head>
  <body>
    <!-- <div class="container"></div> -->
    <!-- <div class="loading"></div> -->
    <!-- <div class="bounce"></div> -->
    <div class="con">
      <div class="sequre-move"></div>
    </div>
  </body>
</html>
