<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .container {
        background-color: #d40101;
        display: grid;
        /* Mobile screens: 1 Column */
        grid-template-columns: repeat(1, 1fr);
        gap: 10px;
        border: 1px solid;
      }

      .child_container {
        width: 100%;
        height: 100px;
        background-color: lightblue;
        border: 1px solid black;
        /* display: flex;
        align-items: center;
        justify-content: center; */
      }

      /* Tablet (426px and up) -> 2 Columns */
      @media (min-width: 426px) {
        .container {
          grid-template-columns: repeat(2, 1fr);
          background-color: #d40101;
        }
      }

      /* Laptop (768px and up) -> 3 Columns */
      @media (min-width: 768px) {
        .container {
          grid-template-columns: repeat(3, 1fr);
          background-color: gold;
        }
      }

      /* Large Desktop (1068px and up) -> 4 Columns */
      @media (min-width: 1068px) {
        .container {
          grid-template-columns: repeat(4, 1fr);
          background-color: blue;
        }
      }

      @media (min-width: 1401px) {
        .container {
          grid-template-columns: repeat(5, 1fr);
          background-color: green;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="child_container">1</div>
      <div class="child_container">2</div>
      <div class="child_container">3</div>
      <div class="child_container">4</div>
      <div class="child_container">5</div>
      <div class="child_container">6</div>
      <div class="child_container">7</div>
      <div class="child_container">8</div>
      <div class="child_container">9</div>
    </div>
  </body>
</html>
