<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .container {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 200px;
        height: 200px;
        border: 1px solid;
        transition: 3s ease;
        background-color: rgb(10, 23, 23);
        /* transition-property: width; */
        transition-duration: 6s ease;
        color: aliceblue;
        margin: auto;
        transform: scale(.1);

      }
      .container:hover {
        /* width: 300px; */
        transform: rotate(160deg) scale(1.5);
        font-weight: bold;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div class="container">hello world</div>
  </body>
</html>
