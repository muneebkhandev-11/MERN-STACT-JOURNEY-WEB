<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>List of Css</title>
    <style>
      ul {
        /* list-style: disc; */
        /* list-style: square; */
        /* list-style: none; */
        list-style: circle;
        margin: auto;
        border: 3px solid brown;
        height: 100px;
        width: 300px;
        display: inline-block;
        /* list-style-position:outside; */
        list-style-position: inside;
      }
      ol {
        /* list-style: decimal; */
        /* list-style: upper-alpha; */
        /* list-style: lower-alpha; */
        /* list-style: upper-roman; */
        list-style: lower-roman;
        list-style: none;
        gap: 50px;
      }
      li{
        display: inline;

      }
    </style>
  </head>
  <body>
    <ul>
      <li>List NO 1</li>
      <li>List NO 2</li>
      <li>List NO 3</li>
      <li>List NO 4</li>
    </ul>
    <ol>
      <li>List NO 1</li>
      <li>List NO 2</li>
      <li>List NO 3</li>
      <li>List NO 4</li>
    </ol>
  </body>
</html>
