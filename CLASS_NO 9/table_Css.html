    <title>Table OF Css</title>
    <style>
      table {
        border: 1px solid black;
        width: 50%;
        height: 80vh;
        border-collapse: collapse;
      }
      th,td {
        border: 1px solid;
        text-align: center;
        padding: 10px;
      }
      th{
        background-color: black;
        color: white;
      }
      td:hover{
        background-color: blueviolet;
        color: aqua;
        transition: 0.5s ease;

      }
      th:hover{
        background-color: white;
        color: black;
      }
      /* tr:nth-child(even) {

      } */

      
    </style>
  </head>
