<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display:grid;
            grid-template: repeat(3, 1fr) / repeat(3,1fr);
            height: 80vh;
            width: 80vw;
            border: 1px solid;
            /* gap: 40px; */
            row-gap: 40px;
            /* column-gap: 50px; */

        }
        .grid-item{
            border: 1px solid;
            /* height: 100px;
            width: 100px; */
        }
        /* .grid-item_3{
            align-self: center;
            justify-self: center;
        } */
    </style>
</head>
<body>
    <div class="container">
        <div class="grid-item grid-item_1 ">1</div>
        <div class="grid-item">2</div>
        <div class="grid-item grid-item_3">3</div>
        <div class="grid-item">4</div>
        <div class="grid-item">5</div>
        <div class="grid-item">6</div>
        <div class="grid-item">7</div>
    </div>
</body>
</html>
