<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .container {
        border: 1px solid;
        height: 55vh;
        width: 70vw;
        display: grid;
        /* grid-template-columns: 100px 100px 120px 90px; */
        /* grid-template-columns: 100px auto 120px 90px; */
        /* grid-template-columns: repeat(4 ,50px); */
        /* grid-template-columns: 1fr 100px auto; */
        grid-template-columns: 1fr 100px 2fr;

        /* horizental_alignment */
        /* justify-items: center; */
        /* justify-items: start; */
        /* justify-items: end; */

        /* vertical-alignmnet */
        /* align-items: center; */
        /* align-items:start ; */
        /* align-items:end ; */
        place-items: center;
      }
      .grid-item {
        border: 1px solid;
        width: 55px;
        height: 55px;
        place-items: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="grid-item">1</div>
      <div class="grid-item">2</div>
      <div class="grid-item">3</div>
      <div class="grid-item">4</div>
      <div class="grid-item">5</div>
    </div>
  </body>
</html>
