<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .container {
        border: 1px solid;
        display: grid;
        height: 60vh;
        grid-template-columns: repeat(4, 1fr);
      }
      .grid-item {
        border: 1px solid;
        /* height: 55px;
        width: 55px; */
      }
      .grid-item_2 {
       grid-column-start: 2;
       grid-column-end: 4;
      }
      .grid-item_1 {
        grid-row-start: 1;
        grid-row-end: 4;
      }
      .grid-item_6 {
        grid-row-start: 2;
        grid-row-end: 4;
        grid-column-start: 4;
        grid-column-end: 4;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="grid-item grid-item_1">1</div>
      <div class="grid-item grid-item_2">2</div>
      <div class="grid-item grid-item_3">3</div>
      <div class="grid-item grid-item_4">4</div>
      <div class="grid-item grid-item_5">5</div>
      <div class="grid-item grid-item_6">6</div>
      <div class="grid-item grid-item_7">7</div>
      <div class="grid-item grid-item_8">8</div>
    </div>
  </body>
</html>
