<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Css Assignment_NO 03</title>
    <style>
        body{
            background-color: antiquewhite;
        }
      h1 {
        text-align: center;
        margin-top: 0%;
        padding-top: 0%;
      }
      form {
        border: 1px solid;
        border:transparent;
        width: 70%;
        height: 75vh;
        margin: auto;
        padding: 50px 30px;
        margin-top: 40px;
        background-color: aliceblue;
        border-radius: 15px;

      }
      input {
        display: block;
        box-sizing: border-box;
        width: 100%;
        padding: 16px ;
        border-radius: 10px;
        border: 1px solid gray;
      }
      label {
        display: block;
        padding: 0%;
        margin: 3px;
        padding-top: 15px;
      }
      #Login {
        display: block;
        margin: auto;
        padding: 10px;
        width: 10%;
        margin-top: 12px;
        border-radius: 5px;
        border: 1px solid gray;
      }

      textarea {
        display: block;
        border: 1px solid gray;
        box-sizing: border-box;
        padding: 25px;
        width: 100%;
        padding: 3%;
        border-radius: 10px;
      }
      .group {
        margin-bottom: 15px;
      }
      #Login:hover {
        background-color: rgb(255, 149, 0);
        cursor: pointer;
      }
      input:focus {
        display: block;
        outline: none;
      }
      textarea:focus{
        display: block;
        outline: none;
        

      }
    </style>
  </head>
  <body>
    <form action="">
      <div class="group">
        <h1>Contact Us!</h1>
        <label for="">Full Name:</label>
        <input type="text" name="" id=""  placeholder="enter your name..." required/>

        <label for="">Email:</label>
        <input type="email" name="" id="" placeholder="enter your email..."  required/>

        <label for="">Password:</label>
        <input type="password" name="" id="" placeholder="Password Must be 8 Character including Symboles and Numbers" required/>

        <label for="">Feedback:</label>
        <textarea name="" id="" placeholder="leave a Message For Us!"></textarea>

        <input type="submit" name="" id="Login" value="SUBMIT" />
      </div>
    </form>
  </body>
</html>
